<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Kits</title>
<style>
:root {
  --bg: #15171a; --panel: #1d2024; --panel2: #24282d; --line: #343a41; --text: #dfe3e6; --dim: #8b949c;
  --accent: #c8a55a; --accent2: #7fb3c9; --bad: #d26a5c; --ok: #7ab87a; --sel: #2f3a44;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 "Segoe UI", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: #5a4a26; border-color: var(--accent); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
button.small { padding: 1px 6px; font-size: 12px; }
input, select { background: #121417; border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; }
input[type=number] { width: 58px; }
input[type=color] { padding: 0; width: 26px; height: 22px; border: 1px solid var(--line); }
.app.units { grid-template-columns: 230px 1fr 0; }
.app.units section.cat { display: none; }
.mode button.sel { border-color: var(--accent); color: var(--accent); }
.unit { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.unit.draft { border-style: dashed; opacity: .85; }
.unit textarea { width: 100%; min-height: 38px; background: #121417; color: var(--text); border: 1px solid var(--line); border-radius: 3px; font: inherit; }
.grp { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 10px; }
.old { font-size: 12px; border-collapse: collapse; margin: 4px 0 12px; }
.old td, .old th { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
.old th { color: var(--dim); font-weight: normal; }
.kitThumbs { display: flex; gap: 2px; }
.kitThumbs img { max-height: 30px; max-width: 30px; }
.app { display: grid; grid-template-columns: 230px 1fr 420px; grid-template-rows: 42px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; color: var(--accent); letter-spacing: .5px; }
header .sp { flex: 1; }
#saveState { color: var(--dim); font-size: 12px; }
aside, main, section.cat { overflow: auto; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 8px; }
aside h3 { font-size: 11px; text-transform: uppercase; color: var(--dim); margin: 12px 4px 4px; letter-spacing: .6px; }
.colItem { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.colItem:hover { background: var(--panel2); }
.colItem.sel { background: var(--sel); color: #fff; }
.colItem .n { color: var(--dim); font-size: 11px; }
main { padding: 12px 16px 40px; }
.empty { color: var(--dim); padding: 40px; text-align: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.row label { color: var(--dim); font-size: 12px; display: flex; gap: 5px; align-items: center; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
.chip b { cursor: pointer; color: var(--dim); margin-left: 4px; }
.vars { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.varTab { width: 108px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; padding: 4px; text-align: center; }
.varTab.sel { border-color: var(--accent); background: var(--sel); }
.varTab .thumb { height: 72px; display: flex; align-items: center; justify-content: center; }
.varTab .thumb img { max-height: 72px; max-width: 96px; image-rendering: auto; }
.varTab .nm { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.varTab .w { font-size: 11px; color: var(--dim); }
.varTab.add { display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; min-height: 104px; }
.varHead { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.varHead .portrait { width: 110px; height: 110px; background: #101214; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.varHead .portrait img { max-width: 110px; max-height: 110px; }
h2 { font-size: 13px; color: var(--accent); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .6px; display: flex; gap: 8px; align-items: baseline; }
h2 small { color: var(--dim); text-transform: none; letter-spacing: 0; font-weight: normal; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
.it { display: grid; grid-template-columns: 56px 1fr; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; position: relative; }
.it.conflict { border-color: var(--bad); }
.it .ic { width: 56px; height: 56px; background: #101214; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.it .ic img { max-width: 52px; max-height: 52px; }
.it .lb { font-weight: 600; padding-right: 18px; }
.it .meta { color: var(--dim); font-size: 11px; }
.it .ctl { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.it .ctl select { max-width: 120px; }
.it .x { position: absolute; top: 3px; right: 5px; cursor: pointer; color: var(--dim); }
.it .x:hover { color: var(--bad); }
.warn { color: var(--bad); font-size: 12px; margin: 4px 0; }
.cover { margin-top: 6px; border-collapse: collapse; font-size: 11px; }
.cover td, .cover th { border: 1px solid var(--line); padding: 2px 6px; text-align: left; }
.cover th { color: var(--dim); font-weight: normal; }
section.cat { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.catTop { padding: 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs { display: flex; gap: 4px; }
.tabs button.sel { border-color: var(--accent); color: var(--accent); }
.catGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px; padding: 8px; }
.ci { background: var(--panel2); border: 1px solid transparent; border-radius: 4px; padding: 4px; cursor: pointer; text-align: center; }
.ci:hover { border-color: var(--accent); }
.ci .ic { height: 56px; display: flex; align-items: center; justify-content: center; }
.ci .ic img { max-width: 56px; max-height: 56px; }
.ci .nm { font-size: 11px; line-height: 1.2; height: 2.4em; overflow: hidden; }
.ci .md { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.catInfo { color: var(--dim); font-size: 11px; padding: 0 8px; }
.ammo { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-top: 3px; }
.am { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; background: #121417; border: 1px solid var(--line); border-radius: 9px; padding: 0 6px 0 2px; cursor: pointer; }
.am img { max-width: 16px; max-height: 16px; }
.am:hover { border-color: var(--accent); }
.am.on { border-color: var(--ok); color: var(--ok); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2a2416; border: 1px solid var(--accent); border-radius: 6px; padding: 8px 14px; z-index: 60; display: none; }
#tip { position: fixed; pointer-events: none; background: #0d0f11; border: 1px solid var(--line); border-radius: 4px; padding: 8px; max-width: 320px; font-size: 12px; display: none; z-index: 50; }
#tip b { color: var(--accent); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-width: 900px; max-height: 85vh; overflow: auto; width: 90vw; }
.mceGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.mce { border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; }
.mce:hover { border-color: var(--accent); }
.mce.sel { border-color: var(--ok); background: #22301f; }
.mce img { max-width: 110px; max-height: 110px; }
pre { white-space: pre-wrap; background: #101214; padding: 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>EDITOR DE KITS · Ecos da Queda</h1>
    <span class="mode"><button id="mKits" class="sel">Kits</button> <button id="mUnits">Unidades</button></span>
    <span id="saveState"></span>
    <span class="sp"></span>
    <a href="/pesquisa" style="color:var(--accent2)">Árvore de pesquisa →</a>
    <button id="btnBuild" class="primary" title="Gera os Defs do editor: kits, unidades e árvores de pesquisa">Gerar Defs do mod</button>
  </header>
  <aside>
    <button id="btnNewCol" style="width:100%">+ Nova coleção</button>
    <div id="colList"></div>
  </aside>
  <main id="main"><div class="empty">Carregando…</div></main>
  <section class="cat">
    <div class="catTop">
      <div class="tabs" id="catTabs"></div>
      <input id="catSearch" placeholder="Buscar (nome ou defName)…">
      <div class="row" style="margin:0">
        <select id="catMod"><option value="">Todos os mods</option></select>
        <select id="catLayer"><option value="">Toda camada</option></select>
        <select id="catTech"><option value="">Todo nível</option></select>
      </div>
    </div>
    <div class="catInfo" id="catInfo"></div>
    <div class="catGrid" id="catGrid"></div>
  </section>
</div>
<div id="tip"></div>

<script>
'use strict';
const QUALITIES = [['Awful','Horrível'],['Poor','Ruim'],['Normal','Normal'],['Good','Boa'],['Excellent','Excelente'],['Masterwork','Obra-prima'],['Legendary','Lendária']];
const TECH = {Neolithic:'Neolítico', Medieval:'Medieval', Industrial:'Industrial', Spacer:'Espacial', Ultra:'Ultra', Archotech:'Arcotech', Animal:'Animal', Undefined:'—'};
const SECTIONS = [['apparel','Roupas'],['weapons','Armas'],['inventory','Inventário']];
let CAT = null, ITEMS = {}, STUFF = {}, KINDS = [], FACTIONS = [], XENOS = {};
let cols = [], mceNames = [], UNITS = [], mode = 'kits', curFac = null;
let curCol = null, curVar = 0, catTab = 'apparel';
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};

// ------------------------------------------------------------ ícones pintados (cor do material / cor escolhida)
const tintCache = new Map(), imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) imgCache.set(src, new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }));
  return imgCache.get(src);
}
function tintFor(def, stuff, color) {
  const it = ITEMS[def];
  if (!it) return null;
  if (color) return color;
  if (it.stuffCats) { const s = STUFF[stuff || it.defaultStuff]; if (s) return s.color; }
  return it.color && it.color.toUpperCase() !== '#FFFFFF' ? it.color : null;
}
function iconImg(def, stuff, color) {
  const img = el('img', {alt: '', loading: 'lazy'});
  const tint = tintFor(def, stuff, color);
  const src = '/icons/' + encodeURIComponent(def) + '.png';
  if (!tint) { img.src = src; img.onerror = () => { img.replaceWith(el('span', {class: 'meta'}, '?')); }; return img; }
  const key = def + '|' + tint;
  if (tintCache.has(key)) { img.src = tintCache.get(key); return img; }
  loadImg(src).then(i => {
    if (!i) { img.replaceWith(el('span', {class: 'meta'}, '?')); return; }
    const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
    const g = c.getContext('2d');
    g.drawImage(i, 0, 0);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = tint; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(i, 0, 0);
    const url = c.toDataURL(); tintCache.set(key, url); img.src = url;
  });
  return img;
}

// ------------------------------------------------------------ dica
const tip = $('#tip');
function showTip(e, def) {
  const it = ITEMS[def]; if (!it) return;
  const lines = [`<b>${esc(it.label)}</b> <span style="color:var(--dim)">${esc(def)}</span>`,
    `${esc(it.mod)} · ${TECH[it.tech] || it.tech} · $${it.value}`];
  if (it.layers) lines.push('Camadas: ' + it.layers.join(', ') + '<br>Cobre: ' + it.parts.join(', '));
  if (it.ammo) lines.push('Munição' + (it.mag ? ' (carregador ' + it.mag + ')' : '') + ': ' + it.ammo.map(a => esc(shortAmmo(a))).join(', '));
  if (def.startsWith('Ammo_')) { const u = usersOf(def); if (u.length) lines.push('Usada por ' + u.length + ' arma(s): ' + esc(u.slice(0, 8).map(w => w.label).join(', ')) + (u.length > 8 ? '…' : '')); }
  const v = curCol?.variations?.[curVar];
  if (it.kind === 'apparel' && v) { const out = v.apparel.filter(a => apparelClash(a.def, def)); if (out.length) lines.push('<span style="color:var(--bad)">Substitui: ' + esc(out.map(a => ITEMS[a.def]?.label).join(', ')) + '</span>'); }
  if (it.stuffCats) lines.push('Materiais: ' + it.stuffCats.join(', '));
  if (it.desc) lines.push('<span style="color:var(--dim)">' + esc(it.desc) + '</span>');
  tip.innerHTML = lines.join('<br>'); tip.style.display = 'block'; moveTip(e);
}
function moveTip(e) {
  const x = Math.min(e.clientX + 14, innerWidth - 340), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.display = 'none';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ------------------------------------------------------------ salvar (automático)
let saveTimer = null;
function dirty() {
  $('#saveState').textContent = 'alterado…';
  clearTimeout(saveTimer);
  const col = curCol, oldId = col._file || col.id;
  saveTimer = setTimeout(async () => {
    const body = JSON.stringify(col, (k, v) => k.startsWith('_') ? undefined : v);
    const r = await fetch('/api/colecao/' + encodeURIComponent(oldId), {method: 'PUT', body});
    const j = await r.json();
    if (j.error) { $('#saveState').textContent = 'ERRO: ' + j.error; return; }
    col._file = col.id;
    $('#saveState').textContent = 'salvo ' + new Date().toLocaleTimeString();
  }, 500);
}

// ------------------------------------------------------------ lista de coleções
function renderCols() {
  const box = $('#colList'); box.innerHTML = '';
  const groups = {};
  for (const c of cols) {
    const f = FACTIONS.find(x => x.def === c.faction);
    (groups[f ? f.label : 'Sem facção'] ||= []).push(c);
  }
  for (const g of Object.keys(groups).sort()) {
    box.append(el('h3', {}, g));
    for (const c of groups[g].sort((a, b) => a.id.localeCompare(b.id)))
      box.append(el('div', {class: 'colItem' + (c === curCol ? ' sel' : ''), onclick: () => { curCol = c; curVar = 0; renderAll(); }},
        el('span', {}, c.label || c.id), el('span', {class: 'n'}, String((c.variations || []).length))));
  }
}

function newCol() {
  let id = prompt('Nome da coleção (letras, números e _), ex.: soldado_nivel_1');
  if (!id) return;
  id = id.trim().replace(/\s+/g, '_');
  if (!/^[A-Za-z0-9_]+$/.test(id)) return alert('Use só letras sem acento, números e _.');
  if (cols.some(c => c.id === id)) return alert('Já existe.');
  const c = {id, label: id.replace(/_/g, ' '), faction: '', pawnKinds: [], chance: 1, variations: [blankVar('Variação 1')]};
  cols.push(c); curCol = c; curVar = 0; dirty(); renderAll();
}
const blankVar = name => ({name, weight: 1, apparel: [], weapons: [], inventory: []});

// ------------------------------------------------------------ editor da coleção
function renderMain() {
  const m = $('#main'); m.innerHTML = '';
  if (!CAT) { m.append(el('div', {class: 'empty', html: 'Falta o catálogo. Rode <code>python kits/kits.py catalog</code>.'})); return; }
  if (!curCol) { m.append(el('div', {class: 'empty'}, 'Escolha ou crie uma coleção à esquerda.')); return; }
  const c = curCol;
  // cabeçalho da coleção
  const facSel = el('select', {onchange: e => { c.faction = e.target.value; dirty(); renderAll(); }},
    el('option', {value: ''}, '— facção —'), FACTIONS.map(f => el('option', {value: f.def, selected: f.def === c.faction}, f.label)));
  const kindSel = el('select', {onchange: e => { if (e.target.value && !c.pawnKinds.includes(e.target.value)) { c.pawnKinds.push(e.target.value); dirty(); renderMain(); } }},
    el('option', {value: ''}, '+ ligar à unidade…'),
    allKinds().filter(k => !c.faction || k.faction === c.faction).map(k => el('option', {value: k.def}, `${k.label} (${k.def})`)));
  m.append(
    el('div', {class: 'row'},
      el('label', {}, 'Coleção', el('input', {value: c.id, size: 22, onchange: e => {
        const v = e.target.value.trim().replace(/\s+/g, '_');
        if (!/^[A-Za-z0-9_]+$/.test(v) || cols.some(x => x !== c && x.id === v)) { alert('Nome inválido ou repetido.'); e.target.value = c.id; return; }
        c._file = c._file || c.id; c.id = v; dirty(); renderCols(); }})),
      el('label', {}, 'Nome', el('input', {value: c.label || '', size: 26, oninput: e => { c.label = e.target.value; dirty(); renderCols(); }})),
      el('label', {}, 'Facção', facSel),
      el('label', {title: 'Chance de a unidade usar esta coleção (o resto usa o sorteio normal do arsenal)'}, 'Chance %',
        el('input', {type: 'number', min: 0, max: 100, value: Math.round((c.chance ?? 1) * 100), onchange: e => { c.chance = Math.max(0, Math.min(100, +e.target.value)) / 100; dirty(); }})),
      el('button', {class: 'danger small', onclick: async () => {
        if (!confirm('Apagar a coleção "' + c.id + '"?')) return;
        await fetch('/api/colecao/' + encodeURIComponent(c._file || c.id), {method: 'DELETE'});
        cols = cols.filter(x => x !== c); curCol = null; renderAll(); }}, 'Apagar coleção')),
    el('div', {class: 'row'}, el('label', {}, 'Unidades que usam:'),
      el('div', {class: 'chips'}, c.pawnKinds.map(k => {
        const kd = allKinds().find(x => x.def === k);
        return el('span', {class: 'chip', title: k}, kd ? kd.label : k + ' (?)', el('b', {onclick: () => { c.pawnKinds = c.pawnKinds.filter(x => x !== k); dirty(); renderMain(); }}, '×'));
      })), kindSel));
  // abas das variações
  const tot = (c.variations || []).reduce((s, v) => s + (+v.weight || 0), 0) || 1;
  const vars = el('div', {class: 'vars'});
  c.variations.forEach((v, i) => {
    const thumb = el('div', {class: 'thumb'});
    if (v.source && v.source.startsWith('MCEPawns/')) thumb.append(el('img', {src: '/mce/' + encodeURIComponent(v.source.slice(9)) + '.png'}));
    else { const f = v.apparel.find(a => ITEMS[a.def]?.layers?.some(l => /Shell|Middle/.test(l))) || v.apparel[0] || v.weapons[0]; if (f) thumb.append(iconImg(f.def, f.stuff, f.color)); }
    vars.append(el('div', {class: 'varTab' + (i === curVar ? ' sel' : ''), onclick: () => { curVar = i; renderMain(); }},
      thumb, el('div', {class: 'nm'}, v.name || '(sem nome)'), el('div', {class: 'w'}, Math.round((+v.weight || 0) / tot * 100) + '% das vezes')));
  });
  vars.append(el('div', {class: 'varTab add', onclick: () => { c.variations.push(blankVar('Variação ' + (c.variations.length + 1))); curVar = c.variations.length - 1; dirty(); renderMain(); }}, '+ variação vazia'));
  vars.append(el('div', {class: 'varTab add', onclick: openImport}, '⇩ importar do Character Creator'));
  m.append(el('h2', {}, 'Variações', el('small', {}, 'cada pawn da unidade sai com uma delas, sorteada pelo peso')), vars);
  const v = c.variations[curVar];
  if (!v) return;
  renderVar(m, c, v);
}

function renderVar(m, c, v) {
  const portrait = el('div', {class: 'portrait'});
  if (v.source && v.source.startsWith('MCEPawns/')) portrait.append(el('img', {src: '/mce/' + encodeURIComponent(v.source.slice(9)) + '.png'}));
  else portrait.append(el('span', {class: 'meta'}, 'sem retrato'));
  m.append(el('div', {class: 'varHead'}, portrait,
    el('div', {style: 'flex:1'},
      el('div', {class: 'row'},
        el('label', {}, 'Variação', el('input', {value: v.name || '', size: 24, oninput: e => { v.name = e.target.value; dirty(); }, onchange: () => renderMain()})),
        el('label', {title: 'Peso no sorteio (relativo às outras variações)'}, 'Peso', el('input', {type: 'number', min: 0, step: 0.5, value: v.weight ?? 1, onchange: e => { v.weight = Math.max(0, +e.target.value); dirty(); renderMain(); }}))),
      el('div', {class: 'row'},
        el('button', {class: 'small', onclick: () => { const cp = JSON.parse(JSON.stringify(v)); cp.name = (v.name || '') + ' (cópia)'; c.variations.splice(curVar + 1, 0, cp); curVar++; dirty(); renderMain(); }}, 'Duplicar'),

// Duas roupas não vão juntas se dividem uma camada e ocupam alguma parte do corpo em comum (regra do jogo:

function apparelClash(da, db) {
  const a = ITEMS[da], b = ITEMS[db];

  const ha = a.hits || a.parts, hb = b.hits || b.parts;

}
function findConflicts(apparel) {

  return bad;
}

      el('label', {}, 'Papel', el('select', {onchange: e => set('role', e.target.value, true)}, ROLES.map(([r, l]) => el('option', {value: r, selected: (u.role || 'combatente') === r}, l)))),
      el('label', {title: 'Custo em pontos de ataque (quanto maior, menos dessas vêm por ataque)'}, 'Pontos', num('points', {min: 10, step: 5})),
      el('label', {}, 'Idade', num('minAge', {min: 13, max: 120, placeholder: 'mín'}), '–', num('maxAge', {min: 13, max: 200, placeholder: 'máx'})),
      el('label', {title: 'Membro básico: usado quando o jogo precisa de "um membro qualquer" da facção (visitas, missões)'},
        el('input', {type: 'checkbox', checked: !!u.basic, onchange: e => { f.units.forEach(x => delete x.basic); if (e.target.checked) u.basic = true; unitsDirty(f); renderUnits(); }}), 'membro básico')),
    el('div', {class: 'row'}, el('label', {}, 'Aparece em (peso; vazio = não aparece):'),
      el('div', {class: 'grp'}, GROUP_LABELS.map(([g, l]) => el('label', {}, l, el('input', {type: 'number', min: 0, step: 0.5, value: u.groups[g] ?? '',
        onchange: e => { if (e.target.value === '' || +e.target.value === 0) delete u.groups[g]; else u.groups[g] = +e.target.value; unitsDirty(f); }}))))),
    el('div', {class: 'row'}, el('label', {}, 'Xenos:'),
      el('div', {class: 'chips'}, Object.entries(u.xenos).map(([x, w]) => el('span', {class: 'chip'}, (XENOS[x] || x) + ' ',
        el('input', {type: 'number', min: 0, step: 0.5, value: w, style: 'width:46px', onchange: e => { u.xenos[x] = +e.target.value; unitsDirty(f); }}),
        el('b', {onclick: () => { delete u.xenos[x]; unitsDirty(f); renderUnits(); }}, '×')))),
      el('select', {onchange: e => { if (e.target.value) { u.xenos[e.target.value] = 1; unitsDirty(f); renderUnits(); } }},
        el('option', {value: ''}, Object.keys(u.xenos).length ? '+ xeno…' : 'xenos da facção (padrão) / + xeno…'),
        xenoOpts.map(x => el('option', {value: x.def}, x.label + ' (' + x.def + ')')))),
    el('div', {class: 'row'}, el('label', {}, 'Kits:'),
      el('div', {class: 'chips'}, u.kits.map(k => el('span', {class: 'chip'}, (cols.find(c => c.id === k)?.label || k) + ' ', kitThumbs(k),
        el('b', {title: 'Abrir a coleção', onclick: () => { curCol = cols.find(c => c.id === k) || curCol; curVar = 0; mode = 'kits'; $('#btnNewCol').textContent = '+ Nova coleção'; renderAll(); }}, '✎'),
        el('b', {onclick: () => { u.kits = u.kits.filter(x => x !== k); unitsDirty(f); renderUnits(); }}, '×')))),
      el('select', {onchange: e => { if (e.target.value && !u.kits.includes(e.target.value)) { u.kits.push(e.target.value); unitsDirty(f); renderUnits(); } }},
        el('option', {value: ''}, '+ coleção de kit…'),
        cols.filter(c => !c.faction || c.faction === f.faction).map(c => el('option', {value: c.id}, (c.label || c.id) + ' (' + (c.variations || []).length + ' variações)'))),
      el('button', {class: 'small', onclick: () => {
        const id = (f.faction.replace('EQ_Faction_', '') + '_' + u.id).replace(/[^A-Za-z0-9_]/g, '');
        let c = cols.find(x => x.id === id);
        if (!c) { c = {id, label: u.label || u.id, faction: f.faction, pawnKinds: [], chance: 1, variations: [blankVar('Variação 1')]}; cols.push(c); curCol = c; dirty(); }
        if (!u.kits.includes(id)) { u.kits.push(id); unitsDirty(f); }
        curCol = c; curVar = 0; mode = 'kits'; $('#btnNewCol').textContent = '+ Nova coleção'; renderAll();
      }}, '+ criar coleção para esta unidade')),
    el('textarea', {placeholder: 'Notas: papel na facção, quando aparece, ideia de visual…', oninput: e => set('notes', e.target.value)}, u.notes || ''));
}


async function init() {
  const st = await (await fetch('/api/state')).json();
  cols = st.colecoes; cols.forEach(c => c._file = c.id); mceNames = st.mce; UNITS = st.unidades || [];
  if (st.catalog) {
    CAT = await (await fetch('/api/catalog')).json();
    for (const i of CAT.items) ITEMS[i.def] = i;
    for (const s of CAT.stuff) STUFF[s.def] = s;
    for (const x of CAT.xenotypes) XENOS[x.def] = x.label;
    KINDS = CAT.pawnkinds; FACTIONS = CAT.factions;
    renderCatTabs(); fillCatFilters();
  }
  $('#btnNewCol').onclick = () => mode === 'units' ? newUnit() : newCol();
  $('#mKits').onclick = () => { mode = 'kits'; $('#btnNewCol').textContent = '+ Nova coleção'; renderAll(); };
  $('#mUnits').onclick = () => { mode = 'units'; $('#btnNewCol').textContent = '+ Nova unidade'; curFac ||= FACTIONS[0]?.def; renderAll(); };
  $('#btnBuild').onclick = build;
  $('#catSearch').oninput = () => { clearTimeout(catTimer); catTimer = setTimeout(renderCat, 150); };
  for (const s of ['#catMod', '#catLayer', '#catTech']) $(s).onchange = renderCat;
  curCol = cols[0] || null;
  renderAll();
}
init();
</script>
</body>
</html>
